version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Follows the commit conventions of the repository
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    groups:
      # One pull request for everything low risk, so that the remaining ones are all
      # major updates worth looking at individually
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      github-actions:
        patterns:
          - "*"
