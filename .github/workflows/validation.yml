name: Validation

# Deliberately uses pull_request, not pull_request_target: this job needs no secrets,
# so a pull request from a fork runs against the fork's code without any access to
# repository secrets or a writable token.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job builds code from pull requests and never pushes, so the token is
          # not left behind in .git/config where a build could read it
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Also runs spotless:check, which is bound to the verify phase
      - name: Build and test
        run: mvn -V -e -B -ntp clean verify -DtrimStackTrace=false

      # Validation messages and date formats follow the locale, so a run in English
      # only would not catch assertions that depend on it
      - name: Test with a non English locale
        run: mvn -e -B -ntp test -DtrimStackTrace=false -DargLine="-Duser.language=it -Duser.country=IT"

      - name: Package test reports
        if: failure()
        run: find . -name surefire-reports | tar -czf test-reports.tgz -T -

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: test-reports.tgz
          retention-days: 7

  verify-release-artifacts:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Builds what a release would publish, so a broken sources or javadoc jar is
      # found here and not while releasing
      - name: Build release artifacts
        run: mvn -V -e -B -ntp -Prelease -DskipTests install

      - name: Check the published jar
        run: |
          set -e -o pipefail
          jar=$(ls target/spring-binder-for-vaadin-*.jar | grep -v -e '-sources' -e '-javadoc')
          echo "Inspecting $jar"
          contents=$(unzip -Z1 "$jar")
          echo "$contents"
          for required in \
            'META-INF/LICENSE' \
            'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports' \
            'com/github/mcollovati/springbinder/SpringBinder.class'
          do
            grep -qx "$required" <<< "$contents" || { echo "🚫 missing $required"; exit 1; }
          done
          if grep -q 'springbinder/it/' <<< "$contents"; then
            echo "🚫 test sources leaked into the jar"; exit 1
          fi
          if grep -q 'META-INF/VAADIN' <<< "$contents"; then
            echo "🚫 build time Vaadin files leaked into the jar"; exit 1
          fi
          unzip -p "$jar" META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports \
            | grep -qx 'com.github.mcollovati.springbinder.SpringBinderConfiguration' \
            || { echo "🚫 the auto configuration is not registered under its current name"; exit 1; }

  # Single check to require in the branch protection rule: it stays correct when jobs
  # are renamed, added or removed, which a list of job names would not
  validation:
    name: Validation
    needs: [build, verify-release-artifacts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A skipped job counts as not passing, so the gate cannot be got around by a job
      # not running at all
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "🚫 build: ${{ needs.build.result }}, verify-release-artifacts: ${{ needs.verify-release-artifacts.result }}" \
            | tee -a $GITHUB_STEP_SUMMARY
          exit 1
